name: Build development artifacts

on:
  push:
    branches:
      - main
      - nightly
  workflow_dispatch:
    inputs:
      release:
        description: Build the version in package.json as it is, without the -dev suffix (release artifacts)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Release runs (release=true) of a commit with scripts/sign-windows.mjs are
  # signed with the MT-Media certificate (docs/mt-media-code-signing.md): this
  # job builds the programs, sign-windows packs and signs them in the
  # `signing` environment, which waits for the owner's approval. Development
  # builds of every push stay unsigned.
  build-windows:
    name: Windows installer build
    runs-on: windows-latest
    outputs:
      sign: ${{ steps.build.outputs.sign }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set development version
        id: version
        shell: pwsh
        run: |
          $baseVersion = node -p "require('./package.json').version"
          if ('${{ inputs.release }}' -eq 'true') {
            $developmentVersion = $baseVersion
          } else {
            $developmentVersion = "$baseVersion-dev.${{ github.run_number }}"
            npm version $developmentVersion --no-git-tag-version --allow-same-version
          }
          "version=$developmentVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Building Girovo $developmentVersion"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Tauri app (6.0): Rust, then scripts/dist-desktop.mjs — the model,
      # the page, the installer under the Electron build's name.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build installer
        id: build
        shell: bash
        run: |
          if [ "${{ inputs.release }}" = "true" ] && [ -f scripts/sign-windows.mjs ]; then
            node scripts/dist-desktop.mjs --platform win32 --no-bundle
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/dist-desktop.mjs --platform win32
          fi

      - name: Upload development artifacts
        if: steps.build.outputs.sign != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Girovo-${{ steps.version.outputs.version }}-windows
          path: |
            dist/*-Setup.exe
          if-no-files-found: error
          retention-days: 14

      # The programs for sign-windows, which packs and signs them.
      - name: Upload the programs for signing
        if: steps.build.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Girovo-${{ steps.version.outputs.version }}-windows-programs
          path: |
            package.json
            src-tauri/target/release/Girovo.exe
            src-tauri/binaries/
            src-tauri/onnxruntime/
            models/category-model/
          if-no-files-found: error
          retention-days: 1

  # The installer signed with the MT-Media certificate (docs/mt-media-code-signing.md).
  # The key lives in the `signing` environment, which waits for the owner's
  # approval and allows main only. This job runs no npm ci and no cargo build,
  # so no package from either can reach the key: it takes the programs the job
  # before built, installs the Tauri CLI alone, and lets Tauri sign Girovo.exe,
  # its helpers and the uninstaller before NSIS packs them, then the installer.
  sign-windows:
    name: Windows installer, signed
    needs: build-windows
    if: needs.build-windows.outputs.sign == 'true'
    runs-on: windows-latest
    environment: signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Girovo-${{ needs.build-windows.outputs.version }}-windows-programs
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The Tauri CLI alone
        shell: bash
        run: |
          v=$(node -p "require('./package.json').devDependencies['@tauri-apps/cli']")
          npm install --prefix "$RUNNER_TEMP/tauri-cli" --ignore-scripts --no-audit --no-fund "@tauri-apps/cli@$v"
          echo "GIROVO_TAURI_CLI=$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri.cmd" >> "$GITHUB_ENV"
      - name: Signing certificate
        shell: pwsh
        env:
          MT_MEDIA_PFX_BASE64: ${{ secrets.MT_MEDIA_PFX_BASE64 }}
          MT_MEDIA_PFX_PASSWORD: ${{ secrets.MT_MEDIA_PFX_PASSWORD }}
        run: ./scripts/ci-signing-cert.ps1 import
      - name: Installer, signed and checked
        run: node scripts/dist-desktop.mjs --platform win32 --bundle-only --sign
      - name: Forget the certificate
        if: always()
        shell: pwsh
        run: ./scripts/ci-signing-cert.ps1 forget
      - uses: actions/upload-artifact@v4
        with:
          name: Girovo-${{ needs.build-windows.outputs.version }}-windows
          path: |
            dist/*-Setup.exe
            dist/*-Setup.exe.blockmap
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Girovo-${{ needs.build-windows.outputs.version }}-windows-signing-log
          path: dist/signing-log.jsonl
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux AppImage and deb build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set development version
        id: version
        run: |
          baseVersion=$(node -p "require('./package.json').version")
          if [ "${{ inputs.release }}" = "true" ]; then
            developmentVersion="$baseVersion"
          else
            developmentVersion="$baseVersion-dev.${{ github.run_number }}"
            npm version "$developmentVersion" --no-git-tag-version --allow-same-version
          fi
          echo "version=$developmentVersion" >> "$GITHUB_OUTPUT"
          echo "Building Girovo $developmentVersion"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # On Linux x64, onnxruntime-node's postinstall would fetch its CUDA
          # libraries (hundreds of MB); the app ships the CPU runtime only.
          ONNXRUNTIME_NODE_INSTALL: skip

      # The Tauri app's system libraries: WebKitGTK for its window, and what
      # the AppImage bundler needs. Ubuntu's mirror has crawled at 27 kB/s
      # (45 MB in 28 minutes) and once hung outright, so the packages it sends
      # are kept in GitHub's cache, one set per runner image, and installed
      # from there. Without them yet: the mirror once, after a fresh package
      # list (an old one asks for files the mirror no longer has).
      - name: Runner image
        id: image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Tauri's system packages (cache)
        uses: actions/cache@v4
        with:
          path: ~/tauri-debs
          key: tauri-debs-1-${{ steps.image.outputs.id }}
      - name: Install Tauri's system packages
        run: |
          PKGS="libwebkit2gtk-4.1-dev librsvg2-dev patchelf file"
          DEBS="$HOME/tauri-debs"
          if compgen -G "$DEBS/*.deb" > /dev/null && sudo dpkg -i "$DEBS"/*.deb > /dev/null; then
            echo "From the cache: $(ls "$DEBS"/*.deb | wc -l) packages"
            exit 0
          fi
          mkdir -p "$DEBS/partial"
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 -o Dir::Cache::archives="$DEBS" install -y $PKGS
          sudo rm -rf "$DEBS/partial" "$DEBS/lock"
          sudo chown -R "$USER" "$DEBS"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build AppImage and deb
        run: node scripts/dist-desktop.mjs --platform linux

      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Girovo-${{ steps.version.outputs.version }}-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Android APK (GitHub build, debug-signed)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set development version
        id: version
        run: |
          baseVersion=$(node -p "require('./package.json').version")
          if [ "${{ inputs.release }}" = "true" ]; then
            developmentVersion="$baseVersion"
          else
            developmentVersion="$baseVersion-dev.${{ github.run_number }}"
            npm version "$developmentVersion" --no-git-tag-version --allow-same-version
          fi
          echo "version=$developmentVersion" >> "$GITHUB_OUTPUT"
          echo "Building Girovo $developmentVersion"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle runs on JDK 21; the runner's Android SDK fetches the platform
      # and build tools the project names.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci
        env:
          # The Android app runs the category model with ONNX Runtime for
          # Android; the Node runtime's CUDA libraries are not needed here.
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Build APK
        run: node scripts/build-android.mjs --flavor github

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: Girovo-${{ steps.version.outputs.version }}-android
          path: android/app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
