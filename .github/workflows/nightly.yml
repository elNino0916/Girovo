name: Nightly desktop build

# The desktop app as the nightly branch has it, every night that branch has
# new commits: Windows and Linux built here and published as a GitHub
# pre-release, never as Latest. Copies on the "Nightly" update channel get it
# (src-tauri/src/updater/logic.rs, mobile/updates/update-logic.cjs); "Stabil",
# Obtainium's default and the F-Droid repository never see it.
#
# The version is the branch's release with the time and the commit:
# <version>-nightly.<yyyymmddhhmm>.g<commit>. The time orders it — among the
# nightlies, after a hand-made <version>-preview.N and the nightlies named
# <version>-preview.<time> before them, before <version> itself — and the
# commit names it; the installer's Windows file version stays the release's.
# No APK: the release key is not on GitHub, and the GitHub APK's updater
# passes over a release without one.
#
# Copies whose update code predates the nightly name (the nightlies named
# <version>-preview.<time>, a hand-made preview) order "nightly" below
# "preview" and are never offered these builds. A run by hand with the name
# "preview" builds the bridge they take, <version>-preview.<time>.g<commit>;
# from there they have the code that follows the nightlies.
#
# Girovo Next (docs/update-channels.md on the branch): a run by hand with the
# name "next" and the branch girovo-next builds <version>-next.<time>.g<commit>,
# signed with the Next key (secret GIROVO_NEXT_SIGNING_KEY) instead of the
# nightly key, so only copies on the Next channel take it. The schedule
# builds the nightly alone.
#
# GitHub runs scheduled workflows from the default branch, so this file lives
# on main and checks out the branch it builds. It must stay the same file on
# main, nightly and girovo-next: a release made from a commit whose copy
# differs is refused with a 403.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to build
        type: string
        default: 'nightly'
      name:
        description: The pre-release name ("next" for Girovo Next from girovo-next; "preview" only for the bridge from copies before the nightly name)
        type: choice
        options:
          - nightly
          - next
          - preview
        default: nightly

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Version and whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      last: ${{ steps.plan.outputs.last }}
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'nightly' }}

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name || 'nightly' }}
        run: |
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short=7 HEAD)
          base=$(node -p "require('./package.json').version.split('-')[0]")
          stamp=$(date -u +%Y%m%d%H%M)
          case "$NAME" in nightly|preview|next) ;; *) echo "Unknown name: $NAME" >&2; exit 1 ;; esac
          version="$base-$NAME.$stamp.g$short"
          # The commit the last nightly was built from: its tag ends in ".g<commit>".
          # The newest by publish time: GitHub lists releases by their commit's
          # day and then by tag name, so a nightly.* can stand below a
          # preview.* built the same day. A Next build is no nightly.
          last=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.prerelease and (.tag_name | test("\\.g[0-9a-f]{7}$")) and (.tag_name | test("-next\\.") | not))] | max_by(.published_at) | .target_commitish // ""')
          build=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$last" = "$sha" ]; then build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "Girovo $version from $sha (last nightly: ${last:-none}) — build: $build"

  windows:
    name: Windows installer
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set the version
        run: npm version "${{ needs.plan.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      # From 6.0 the desktop app is a Tauri app: Rust, and the branch's own
      # packaging script (scripts/dist-desktop.mjs: the model, the page, the
      # installer under the Electron build's name, and its blockmap). A branch
      # without it is still built with Electron.
      - name: Rust
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build installer
        shell: bash
        run: |
          if [ -f scripts/dist-desktop.mjs ]; then
            node scripts/dist-desktop.mjs --platform win32
          else
            npm run electron:dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-Setup.exe
            dist/*-Setup.exe.blockmap
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux AppImage and deb
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set the version
        run: npm version "${{ needs.plan.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
        env:
          # As in build-development.yml: the CPU runtime only, not CUDA's libraries.
          ONNXRUNTIME_NODE_INSTALL: skip
      # The Tauri app's system libraries: WebKitGTK for its window, and what
      # the AppImage bundler needs. Ubuntu's mirror has crawled at 27 kB/s
      # (45 MB in 28 minutes) and once hung outright, so the packages it sends
      # are kept in GitHub's cache, one set per runner image, and installed
      # from there. Without them yet: the mirror once, after a fresh package
      # list (an old one asks for files the mirror no longer has).
      - name: Runner image
        id: image
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Tauri's system packages (cache)
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: actions/cache@v4
        with:
          path: ~/tauri-debs
          key: tauri-debs-1-${{ steps.image.outputs.id }}
      - name: Tauri's system packages
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          PKGS="libwebkit2gtk-4.1-dev librsvg2-dev patchelf file"
          DEBS="$HOME/tauri-debs"
          if compgen -G "$DEBS/*.deb" > /dev/null && sudo dpkg -i "$DEBS"/*.deb > /dev/null; then
            echo "From the cache: $(ls "$DEBS"/*.deb | wc -l) packages"
            exit 0
          fi
          mkdir -p "$DEBS/partial"
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 -o Dir::Cache::archives="$DEBS" install -y $PKGS
          sudo rm -rf "$DEBS/partial" "$DEBS/lock"
          sudo chown -R "$USER" "$DEBS"
      - name: Rust
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build AppImage and deb
        run: |
          if [ -f scripts/dist-desktop.mjs ]; then
            node scripts/dist-desktop.mjs --platform linux
          else
            npm run electron:dist:linux
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish the pre-release
    needs: [plan, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Notes
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          # What the app shows under "Was ist neu": the branch's last five
          # commits, without their "(feat) " or "(fix) " — nothing else.
          git log --no-merges --format='%s' -5 "$SHA" | sed -E 's/^\([a-z]+\) +//; s/^/- /' > notes.md
          cat notes.md
      # The update manifest girovo.de serves (docs/updater-v2.md on the branch),
      # signed with the nightly key, or a Next build's with the Next key.
      # Branches from before it build without one.
      - uses: actions/setup-node@v4
        if: hashFiles('scripts/sign-update.mjs') != ''
        with:
          node-version: 22
          cache: npm
      - name: Update manifest, signed with the nightly or the Next key
        if: hashFiles('scripts/sign-update.mjs') != ''
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GIROVO_NIGHTLY_SIGNING_KEY: ${{ secrets.GIROVO_NIGHTLY_SIGNING_KEY }}
          GIROVO_NEXT_SIGNING_KEY: ${{ secrets.GIROVO_NEXT_SIGNING_KEY }}
        run: |
          npm ci --ignore-scripts
          key=GIROVO_NIGHTLY_SIGNING_KEY
          case "$VERSION" in *-next.*) key=GIROVO_NEXT_SIGNING_KEY ;; esac
          node scripts/update-manifest.mjs out --version "$VERSION" --notes notes.md
          node scripts/sign-update.mjs sign out/girovo-update.json --key-env "$key"
          node scripts/sign-update.mjs verify out/girovo-update.json
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish (a draft first, then the pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh release create "$VERSION" --draft --prerelease --latest=false --target "$SHA" \
            --title "$VERSION" --notes-file notes.md out/*
          # GitHub's digests against the ones built here, before anyone can see it:
          # a draft that does not match stays a draft.
          gh release view "$VERSION" --json assets \
            --jq '.assets[] | select(.name != "SHA256SUMS.txt") | "\(.digest | sub("sha256:"; "")) \(.name)"' | sort -k2 > github.txt
          awk '$2 !~ /SHA256SUMS/ { sub(/^\*/, "", $2); print $1 " " $2 }' out/SHA256SUMS.txt | sort -k2 > local.txt
          diff github.txt local.txt
          gh release edit "$VERSION" --draft=false --prerelease --latest=false
