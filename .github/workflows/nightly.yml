name: Nightly desktop preview

# A preview of the next major version for the desktop app, every night that
# its branch has new commits: Windows and Linux built here and published as a
# GitHub pre-release, never as Latest. Copies on the "6.0-Vorschau" update
# channel get it (electron/update-logic.cjs newestRelease); "Stabil",
# Obtainium's default and the F-Droid repository never see it.
#
# The version is the branch's release with the time and the commit:
# 6.0.0-preview.<yyyymmddhhmm>.g<commit>. The time orders it (after the
# hand-made 6.0.0-preview.N, before 6.0.0 itself), the commit names it; the
# installer's Windows file version stays 6.0.0.0. No APK: the release key is
# not on GitHub, and the GitHub APK's updater passes over a release without
# one. The hand-made previews bring the APK.
#
# GitHub runs scheduled workflows from the default branch, so this file lives
# on main and checks out the branch it builds.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to build
        type: string
        default: '6.0'

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Version and whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      last: ${{ steps.plan.outputs.last }}
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || '6.0' }}

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short=7 HEAD)
          base=$(node -p "require('./package.json').version.split('-')[0]")
          stamp=$(date -u +%Y%m%d%H%M)
          version="$base-preview.$stamp.g$short"
          # The commit the last nightly was built from: its tag ends in ".g<commit>".
          last=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=40" \
            --jq '[.[] | select(.prerelease and (.tag_name | test("\\.g[0-9a-f]{7}$")))][0].target_commitish // ""')
          build=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$last" = "$sha" ]; then build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "Girovo $version from $sha (last nightly: ${last:-none}) — build: $build"

  windows:
    name: Windows installer
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set the version
        run: npm version "${{ needs.plan.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
      # From 6.0 the desktop app is a Tauri app: Rust, and the branch's own
      # packaging script (scripts/dist-desktop.mjs: the model, the page, the
      # installer under the Electron build's name, and its blockmap). A branch
      # without it is still built with Electron.
      - name: Rust
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build installer
        shell: bash
        run: |
          if [ -f scripts/dist-desktop.mjs ]; then
            node scripts/dist-desktop.mjs --platform win32
          else
            npm run electron:dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-Setup.exe
            dist/*-Setup.exe.blockmap
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux AppImage and deb
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set the version
        run: npm version "${{ needs.plan.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm ci
        env:
          # As in build-development.yml: the CPU runtime only, not CUDA's libraries.
          ONNXRUNTIME_NODE_INSTALL: skip
      # The Tauri app's system libraries: WebKitGTK for its window, and what
      # the AppImage bundler needs.
      - name: Tauri's system packages
        if: hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf file
      - name: Rust
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        if: hashFiles('src-tauri/Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build AppImage and deb
        run: |
          if [ -f scripts/dist-desktop.mjs ]; then
            node scripts/dist-desktop.mjs --platform linux
          else
            npm run electron:dist:linux
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish the pre-release
    needs: [plan, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Notes and checksums
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          # What the app shows under "Was ist neu": the branch's last five
          # commits, without their "(feat) " or "(fix) " — nothing else.
          git log --no-merges --format='%s' -5 "$SHA" | sed -E 's/^\([a-z]+\) +//; s/^/- /' > notes.md
          cat notes.md
      - name: Publish (a draft first, then the pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh release create "$VERSION" --draft --prerelease --latest=false --target "$SHA" \
            --title "$VERSION" --notes-file notes.md out/*
          # GitHub's digests against the ones built here, before anyone can see it:
          # a draft that does not match stays a draft.
          gh release view "$VERSION" --json assets \
            --jq '.assets[] | select(.name != "SHA256SUMS.txt") | "\(.digest | sub("sha256:"; "")) \(.name)"' | sort -k2 > github.txt
          awk '$2 !~ /SHA256SUMS/ { sub(/^\*/, "", $2); print $1 " " $2 }' out/SHA256SUMS.txt | sort -k2 > local.txt
          diff github.txt local.txt
          gh release edit "$VERSION" --draft=false --prerelease --latest=false
