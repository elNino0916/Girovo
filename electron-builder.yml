# Packaging config for the desktop builds, Windows and Linux.
#
# Run `npm run electron:build` first — this only wraps what that produced, and
# that has to be built for the same platform (`npm run electron:dist` and
# `npm run electron:dist:linux` do both in one go).
#
# The app archive holds nothing but the Electron shell. The Next server goes in
# as an extraResource instead: it is started as a child process, and a child
# process cannot execute a file from inside an asar archive.

# The appId keeps the app's old name (Sooskasse-FinTS up to 4.3): the
# installer derives its registry key from it, and that key is how an update
# finds the install it replaces — and its folder, which an existing install
# keeps. A new appId would put Girovo beside the old app instead of over it.
appId: de.elnino0916.sooskasse-fints
productName: Girovo

directories:
  output: dist
  buildResources: build

files:
  - electron/**/*
  # The updater's tests (npm test) have no business in the shipped app.
  - "!electron/**/*.test.cjs"
  - package.json
  # electron-builder collects the production dependencies into the archive on
  # its own, which here would mean a second copy of Next and React. The shell
  # imports nothing but electron and Node built-ins, so drop the lot — only a
  # negated pattern reaches that collector.
  - "!node_modules/**/*"

extraResources:
  - from: .next/standalone
    to: server
  # A directory literally named node_modules is hard-skipped at the root of any
  # copy (app-builder-lib/out/util/filter.js), so the server's dependencies have
  # to come across as their own mapping.
  - from: .next/standalone/node_modules
    to: server/node_modules
  # The on-device category model (lib/category-model.ts), fetched by
  # scripts/fetch-model.mjs; main.cjs points the server at it (GIROVO_MODEL_DIR).
  - from: models/category-model
    to: models/category-model

# Nothing shipped here is a native module — the traced server bundle is plain
# JavaScript — so there is nothing for electron-rebuild to do.
npmRebuild: false

win:
  icon: build/icon.png
  # Added to the extraResources above, not in place of them.
  extraResources:
    # The window shown while an update installs (scripts/build-update-window.mjs),
    # and when the app cannot start or its server stopped (main.cjs, showFatal).
    # Both copy it out first, so it never holds this folder open.
    - from: build/update-window/bin/Girovo-Update.exe
      to: Girovo-Update.exe
  # The installer only: no portable build since 5.13.0. A portable copy from
  # before finds no -portable.exe in a newer release and its updater offers
  # the release page, where the Setup.exe is.
  target:
    - target: nsis
      arch: [x64]

# build/installer.nsh (the default `include` path, so nothing to wire up here)
# overrides the built-in "app is running" scan and adds the welcome page, in
# both languages — see that file for details.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Girovo
  artifactName: ${productName}-${version}-Setup.${ext}
  # The app's two languages and no others (left unset, electron-builder loads
  # all 26 it bundles). NSIS picks one from the Windows display language:
  # German for German, and for anything else the first one listed — so
  # English stays first. No dialog asks.
  installerLanguages: [en_US, de_DE]
  multiLanguageInstaller: true
  displayLanguageSelector: false

# Built on Linux only (CI's ubuntu-latest): the AppImage and the .deb need
# Linux's own tools, which electron-builder does not have on Windows.
#
# Neither updates itself — the updater sees an install it cannot replace
# (update-logic.cjs, installKind: 'manual') and offers the release page.
linux:
  icon: build/icon.png
  # A lower-case command, /usr/bin/girovo for the .deb, rather than "Girovo".
  executableName: girovo
  # The .desktop file is named after package.json's desktopName, which is
  # also the app id Electron gives its windows — so the dock and the task
  # switcher put the running window under the app's own icon.
  syncDesktopName: true
  category: Office;Finance
  synopsis: Banking for German banks via FinTS
  # Packages carry the author's address (Debian's Maintainer field).
  maintainer: MT-Media <moritz@mt-media.eu>
  extraResources:
    # No .exe to take the window's icon from: main.cjs hands it this one.
    - from: build/icon.png
      to: icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

appImage:
  artifactName: ${productName}-${version}-x86_64.${ext}

deb:
  artifactName: ${productName}-${version}-amd64.${ext}
