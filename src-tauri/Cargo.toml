[package]
name = "girovo"
version = "6.0.0"
description = "Girovo: German online banking over FinTS, on your own machine"
authors = ["elNino0916"]
license-file = "../LICENSE"
repository = "https://github.com/elNino0916/Girovo"
edition = "2024"
rust-version = "1.95"

[lib]
name = "girovo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.5", features = ["tray-icon", "image-png"] }
tauri-runtime-wry = { version = "=3.0.0-alpha.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset"] }
sha2 = "0.10"
# rustls' own crypto, already built in: AES-GCM for Electron's sealed shell
# secret, the RSA check of a Windows Hello signature, random bytes. The
# features rustls asks for, nothing more.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
dirs = "6"
open = "5"
sys-locale = "0.3"
tauri-plugin-single-instance = "=3.0.0-alpha.3"
tauri-plugin-notification = "=3.0.0-alpha.3"
# The updater's blockmaps are gzipped JSON (src/updater).
flate2 = "1"
# The category model (src/model.rs): ONNX Runtime 1.31, loaded at run time from
# the library the bundle ships, not linked in. No api-22 or later: from there ort
# gives every session a device selection policy, and onnxruntime-node set none.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
libloading = "0.9"
# The LAN shelf, saving files, the PDF export and telemetry (sync_lan.rs,
# save.rs, pdf.rs, telemetry.rs): the native Save As and folder dialogs, the
# scrubber's patterns, ids, this computer's addresses and name.
rfd = { version = "=0.16.1", default-features = false, features = ["gtk3"] }
regex = "1.13"
uuid = { version = "1.29", features = ["v4"] }
if-addrs = "0.15"
gethostname = "1.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Windows Hello (src/hello.rs): KeyCredentialManager, its buffers and the
# prompt's window. A table of its own beside the one above (Cargo adds the
# features up), so the shell's pieces stay apart in merges.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Security_Cryptography_Core",
  "Storage_Streams",
  "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"

# The shell secret on Linux (src/secret/linux.rs): the Secret Service over
# zbus, which the tray (ksni) already brings.
[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

# The PDF export through WebView2's own DevTools protocol (pdf.rs) — the very
# version tauri-runtime-wry is built on — and the Windows version telemetry
# reports (telemetry.rs).
[target.'cfg(windows)'.dependencies.webview2-com]
version = "=0.39.1"

[target.'cfg(windows)'.dependencies.windows-version]
version = "0.1.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
