<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=393"><title>Aufteilen – Schritte</title><style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wdth,wght,ROND@6..144,25..151,1..1000,0..100&display=block');

:root{
  --primary:#0060a8; --on-primary:#fff; --pc:#d3e4ff; --on-pc:#004880;
  --sc:#dae1ff; --on-sc:#3c4665; --tertiary:#5a5a8b; --tc:#e2dfff;
  --surface:#f8f9ff; --scl:#eff4ff; --sc1:#e9eefa; --sch:#e3e8f4; --schh:#dde3ee;
  --ink:#161c24; --ink-2:#404753; --outline:#707784; --ov:#bfc7d5;
  --green:#0c7336; --green-soft:#eaf4ee; --navy:#0a2c5e; --gold:#f2c14e;
  --slot-1:var(--primary); --slot-2:var(--tertiary); --slot-self:var(--outline);

*{box-sizing:border-box}
html,body{margin:0;background:var(--surface)}
.phone{width:393px;height:852px;overflow:hidden;position:relative;background:var(--surface);

.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:1em;height:1em;

.num{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-0.01em}
.fig{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-0.025em;font-weight:500}
.status{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-weight:500;font-size:14px}
.status .ms{font-size:17px;margin-left:3px}
.bar{height:64px;display:flex;align-items:center;gap:4px;padding:0 4px}
.bar .title{font-size:22px;line-height:28px;flex:1;padding-left:4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2);flex:none}
.sub{font-size:14px;line-height:20px;font-weight:500;color:var(--ink-2);padding:16px 16px 4px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:16px;align-items:center;padding:8px 16px;min-height:64px}
.disc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sch);color:var(--ink-2);font-size:16px;font-weight:500;flex:none}
.disc .ms{font-size:20px}
.name{font-size:16px;line-height:22px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:14px;line-height:20px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-size:16px;line-height:22px;font-weight:500;text-align:right;white-space:nowrap}
.btn{height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;flex:none}
.btn.lg{height:56px;border-radius:28px;font-size:16px;padding:0 24px}
.btn.textb{padding:0 12px}
.filled{background:var(--primary);color:var(--on-primary)}
.tonal{background:var(--sc);color:var(--on-sc)}
.text{color:var(--primary)}
.quiet{color:var(--ink-2)}
.btn .ms{font-size:20px}
.chip{height:32px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;line-height:20px;font-weight:500;box-shadow:inset 0 0 0 1px var(--ov);color:var(--ink-2);white-space:nowrap}
.chip.on{box-shadow:none;background:var(--sc);color:var(--on-sc)}
.chip .ms{font-size:18px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.field{height:56px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--outline);display:flex;align-items:center;padding:0 16px;font-size:16px;position:relative}
.field label{position:absolute;top:-8px;left:12px;padding:0 4px;background:var(--surface);font-size:12px;line-height:16px;color:var(--ink-2)}
.field.focus{box-shadow:inset 0 0 0 2px var(--primary)}
.field.focus label{color:var(--primary)}
.help{font-size:12px;line-height:16px;color:var(--ink-2);padding:4px 16px 0}
.handle{position:absolute;bottom:8px;left:50%;width:108px;height:4px;margin-left:-54px;border-radius:2px;background:var(--ink);opacity:.38}
.seg{display:flex;gap:2px}
.seg > div{flex:1 1 auto;min-width:0;height:40px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;
  background:var(--sc1);color:var(--ink-2);border-radius:8px;padding:0 8px;white-space:nowrap}
.seg > div:first-child{border-radius:20px 8px 8px 20px}
.seg > div:last-child{border-radius:8px 20px 20px 8px}
.seg > div.on{background:var(--primary);color:var(--on-primary);border-radius:20px}
.seg .ms{font-size:18px}
.plate{width:18px;height:18px;border-radius:5px;background:var(--navy);display:block;flex:none}
.plate svg{display:block;width:100%;height:100%}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 34px;display:flex;align-items:center;gap:8px;background:var(--surface)}
</style></head><body><div class="phone"><div class="status"><span class="num">9:41</span><span><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span></div><div class="bar"><div class="ib"><span class="ms" style="">close</span></div><div class="title">Aufteilen</div></div><div style="display:flex;gap:4px;padding:0 16px"><i style="flex:1;height:4px;border-radius:2px;background:var(--primary)"></i><i style="flex:1;height:4px;border-radius:2px;background:var(--sc)"></i></div><div style="display:flex;justify-content:center;align-items:center;gap:12px;padding-top:28px"><div class="disc"><span class="ms" style="">restaurant</span></div><div><div class="name">Sushi Yana</div><div class="meta">Mittwoch, 21.10. · <span class="num">−30,79&nbsp;€</span></div></div></div><div style="text-align:center;font-size:22px;line-height:28px;font-weight:500;padding-top:64px">Wie viele?</div><div style="display:flex;justify-content:center;align-items:center;gap:36px;padding-top:24px"><div style="width:56px;height:56px;border-radius:50%;background:var(--sc);color:var(--on-sc);display:grid;place-items:center"><span class="ms" style="">remove</span></div><div class="fig" style="font-size:64px;line-height:72px;min-width:56px;text-align:center">3</div><div style="width:56px;height:56px;border-radius:50%;background:var(--sc);color:var(--on-sc);display:grid;place-items:center"><span class="ms" style="">add</span></div></div><div class="meta" style="text-align:center;padding-top:4px">Personen, du eingeschlossen</div><div style="display:flex;justify-content:center;align-items:baseline;gap:10px;padding-top:72px"><span style="font-size:22px;line-height:28px;color:var(--ink-2)">je</span><span class="fig" style="font-size:48px;line-height:56px">10<span style="font-size:.58em">,26&nbsp;€</span></span></div><div class="meta" style="text-align:center;padding-top:8px">Du übernimmst den übrigen Cent: <span class="num">10,27&nbsp;€</span></div><div
