<body><div class="board"><h1>A · Conversation</h1><p class="lede">Asking gets its own thread. You ask follow-ups, Girovo answers in short sentences and works out every figure itself. Questions from anywhere in the app land in this thread.</p>
<div class="row-of"><figure><div class="frame"><iframe src="t1.html" width="393" height="852"></iframe></div><figcaption><b>Ask.</b> The search opens the thread. Every figure is underlined; a tap shows the bookings behind it.</figcaption></figure><figure><div class="frame"><iframe src="t2.html" width="393" height="852"></iframe></div><figcaption><b>Analyse.</b> After a month ends, a short recap sits on top. „Weiter fragen“ turns it into a conversation.</figcaption></figure><figure><div class="frame"><iframe src="t3.html" width="393" height="852"></iframe></div><figcaption><b>Booking details.</b> A dock at the bottom asks about this booking. The question goes into the thread with the booking attached.</figcaption></figure><figure><div class="frame desk" style="width:1037px;height:648px"><iframe src="desktop.html" width="1440" height="900" style="transform:scale(0.72);transform-origin:0 0"></iframe></div><figcaption style="max-width:1037px"><b>Desktop.</b> The thread docks to the right of the sheet, and the list on the left shows what the last answer is about. Past conversations sit in the sidebar.</figcaption></figure></div></div></body></html>
