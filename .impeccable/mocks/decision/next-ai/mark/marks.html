<!doctype html><html><head><meta charset="utf-8"><style>

.l{background:#f8f9ff}.d{background:#0e141c;color:#dde3ee}

</style></head><body>
<div class="r">

<div class="c l"><img src="b-euro-sprechblase.svg"><span class="n">B · €-Sprechblase</span></div>

</div>
<div class="r">
<div class="c d"><img src="a-dark.svg"><span class="n">A</span></div>
<div class="c d"><img src="b-dark.svg"><span class="n">B</span></div>
<div class="c d"><img src="c-dark.svg"><span class="n">C</span></div>
</div></body></html>
